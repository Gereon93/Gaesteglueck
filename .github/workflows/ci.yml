name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Lint (swift format check)
        run: |
          if command -v swift-format &> /dev/null; then
            swift-format lint --recursive Sources/ Tests/ --strict
          else
            echo "swift-format not available, skipping lint"
          fi

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  ios-build:
    # Compile-Check fürs iPad-Target (Simulator, kein Signing) — die
    # iPad-App wird nicht released, soll aber nicht stillschweigend brechen.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build iPad app for simulator
        run: |
          xcodebuild -project ios/Gaesteglueck-iPad.xcodeproj \
            -scheme Gaesteglueck-iPad \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  prompt-eval:
    # KI-Prompt-Gate: prüft beim Merge auf main ob die Produktions-Prompts
    # noch wie erwartet greifen (deepeval + OpenRouter). Ohne gesetztes
    # OPENROUTER_API_KEY-Secret wird sauber übersprungen statt rot.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret-Check
        id: secretcheck
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY nicht gesetzt — Prompt-Eval übersprungen."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.secretcheck.outputs.has_key == 'true'
        run: pip install -r eval/requirements.txt

      - name: Extract prompts from Swift
        if: steps.secretcheck.outputs.has_key == 'true'
        run: python eval/extract_prompts.py

      - name: Run prompt eval
        if: steps.secretcheck.outputs.has_key == 'true'
        working-directory: eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVAL_SUT_MODEL: ${{ vars.EVAL_SUT_MODEL || 'openai/gpt-4o-mini' }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
        run: python -m pytest -v --no-header

  release:
    # Baut bei jedem Merge auf main eine DMG und veröffentlicht sie als
    # GitHub Release. Mit Apple-Developer-Secrets wird per Developer ID signiert
    # und notarisiert; ohne Secrets bleibt der bisherige Ad-hoc-Fallback aktiv.
    # Apple-Secrets liegen im geschützten Environment "release", nicht in
    # PR-Jobs. Das verhindert Secret-Zugriff aus untrusted Pull Requests.
    # prompt-eval ist bewusst KEINE Voraussetzung: ein flakiges LLM-Judge-Urteil
    # soll kein Release blockieren.
    needs: [build-and-test, ios-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build .app bundle
        run: ./scripts/build-macos-app.sh

      - name: Check Apple signing secrets
        id: apple-signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "release_notes=Die App ist mit Developer ID signiert und von Apple notarisiert." >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "release_notes=Die App ist ad-hoc-signiert und nicht notarisiert. Beim ersten Start ggf. Rechtsklick → Öffnen wählen oder \`xattr -dr com.apple.quarantine /Applications/Gaesteglueck.app\` ausführen." >> "$GITHUB_OUTPUT"
            echo "::warning::Apple-Signierung übersprungen. Fehlende Secrets: ${missing[*]}"
          fi

      - name: Import Developer ID certificate
        if: steps.apple-signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Developer ID codesign
        if: steps.apple-signing.outputs.enabled == 'true'
        run: |
          codesign --force --deep --timestamp --options runtime \
            --sign "Developer ID Application" \
            dist/Gaesteglueck.app

          codesign --verify --deep --strict --verbose=2 dist/Gaesteglueck.app

      - name: Notarize app bundle
        if: steps.apple-signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/Gaesteglueck.app dist/Gaesteglueck-notary.zip

          xcrun notarytool submit dist/Gaesteglueck-notary.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple dist/Gaesteglueck.app
          xcrun stapler validate dist/Gaesteglueck.app

      - name: Ad-hoc codesign
        if: steps.apple-signing.outputs.enabled != 'true'
        run: codesign --force --deep --sign - dist/Gaesteglueck.app

      - name: Read version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)
          TAG="v${VERSION}-build${{ github.run_number }}"
          # Bei Workflow-Reruns bleibt run_number gleich — Suffix verhindert
          # die Tag-Kollision mit dem ersten Versuch.
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            TAG="${TAG}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/Gaesteglueck.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Gästeglück" -srcfolder dist/dmg -ov -format UDZO dist/Gaesteglueck.dmg

      - name: Sign and notarize DMG
        if: steps.apple-signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --timestamp \
            --sign "Developer ID Application" \
            dist/Gaesteglueck.dmg

          xcrun notarytool submit dist/Gaesteglueck.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple dist/Gaesteglueck.dmg
          xcrun stapler validate dist/Gaesteglueck.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gästeglück ${{ steps.version.outputs.tag }}
          files: dist/Gaesteglueck.dmg
          generate_release_notes: true
          body: |
            Automatischer Build vom Merge auf `main` (${{ github.sha }}).

            **Installation:** DMG öffnen, App nach „Programme“ ziehen.
            ${{ steps.apple-signing.outputs.release_notes }}
