name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Lint (swift format check)
        run: |
          if command -v swift-format &> /dev/null; then
            swift-format lint --recursive Sources/ Tests/ --strict
          else
            echo "swift-format not available, skipping lint"
          fi

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  bundle-app:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build .app bundle
        run: ./scripts/build-macos-app.sh

      - name: Zip bundle
        run: |
          cd dist
          zip -r Gaesteglueck.app.zip Gaesteglueck.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gaesteglueck-${{ github.sha }}
          path: dist/Gaesteglueck.app.zip
          retention-days: 30
