name: swiftlint

on:
  pull_request:

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint (Findings als PR-Annotations)
        run: swiftlint lint --reporter github-actions-logging
