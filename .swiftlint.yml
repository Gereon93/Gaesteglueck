# Formatierung (Zeilenlänge, Klammern, Kommata) liegt bei swift-format in ci.yml.
# SwiftLint deckt hier nur ab, was swift-format nicht sieht: Struktur und Semantik.

included:
  - Sources
  - Tests

excluded:
  - .build
  - ios/build

disabled_rules:
  - line_length
  - trailing_comma
  - statement_position
  - opening_brace

identifier_name:
  # Kurznamen (a, b, g) sind in Closures und Tests idiomatisch.
  min_length:
    warning: 0
    error: 0
  # snake_case ausschließlich für JSON-Felder der LLM-APIs.
  excluded:
    - max_tokens
    - response_format
    - reasoning_content
    - finish_reason

# Error-Schwellen als Deckel über dem Altbestand: die Warnungen bleiben
# sichtbar, aber die Pipeline failt erst wenn es schlimmer wird.
type_body_length:
  warning: 350
  error: 500
function_body_length:
  warning: 40
  error: 200
cyclomatic_complexity:
  warning: 10
  error: 40
large_tuple:
  warning: 2
  error: 6
